# Isolated inference environment, derived from upstream's original versions.
# Actual resolved package versions are recorded under runs/validation/environment/.
# Environment installation is not model loading or inference validation.
# ROS 2 remains in /usr/bin/python3, outside this environment.
name: dp_ur7e
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip=22.2.2
  - pytorch=1.12.1
  - torchvision=0.13.1
  - cudatoolkit=11.6
  - mkl=2023.1.0
  - numpy=1.23.3
  - scipy=1.9.1
  - py-opencv=4.6.0
  - h5py=3.7.0
  - hydra-core=1.2.0
  - einops=0.4.1
  - dill=0.3.5.1
  - pyyaml=6.0.2
  - psutil=5.9.2
  - tqdm=4.64.1
  - termcolor=2.0.1
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - pytest=7.4.4
  - pip:
      - diffusers==0.11.1
      - huggingface-hub==0.25.2
      - robomimic==0.2.0
      - ur-rtde==1.6.5
      # Imported by upstream LinearNormalizer even for inference-only use.
      - zarr==2.12.0
      - numcodecs==0.10.2
