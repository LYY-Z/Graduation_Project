[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-ur7e"
version = "0.2.0"
description = "UR7e and wrist-camera integration with a guarded Diffusion Policy inference pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.8,<1", "opencv-python-headless>=4.8,<4.12"]
deploy = ["paramiko>=3,<6", "requests>=2.28,<3"]

[project.scripts]
dp-ur7e = "dp_ur7e.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["ros: requires system ROS Python and rclpy"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
